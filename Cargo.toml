[workspace]
resolver = "2"
members = [
    "crates/rustpacker-core",
    "crates/rustpacker-stub",
    "crates/rustpacker-cli",
    "crates/rustpacker-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean Shaffer"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
