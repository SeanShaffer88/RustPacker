[workspace]
resolver = "2"
members = [
    "crates/rustpacker-core",
    "crates/rustpacker-stub",
    "crates/rustpacker-cli",
    "crates/rustpacker-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.70 is where std::sync::OnceLock stabilised; the workspace uses it.
rust-version = "1.70"
license = "MIT"
authors = ["Sean Shaffer"]

[profile.release]
# Size-first: the stub is copied into every installer payload.
opt-level = "z"
lto = true
codegen-units = 1
# BUGS.md / AUDIT.md L11: `panic = "abort"` means an unexpected panic exits
# with code 134 (SIGABRT) and prints nothing useful, because symbols are also
# stripped. That is the right trade for the stub — it must stay small — so the
# behaviour is documented rather than changed, and every panic-prone path is
# an explicit `Result` instead of an `unwrap`. Debug builds keep
# `panic = "unwind"` and full symbols, so a failure there still produces a
# readable backtrace.
panic = "abort"
strip = true

[profile.dev]
# Defaults, restated so the contrast with `release` above is visible in this
# file rather than implied: unwinding panics and unstripped symbols.
panic = "unwind"
debug = true
