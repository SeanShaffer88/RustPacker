schema_version = 1
typewriter_interval_ms = 12
path_scope = ""

[app]
name = "Demo App"
version = "0.1.0"
publisher = "Sean Shaffer"
app_id = "RustPackerDemo"
main_exe = "DemoApp.exe"
description = "A tiny demo package for RustPacker."

[install]
scope = "per-user"
default_dir = "{per-user-programs}"
source_dir = "payload"
license_file = ""
require_admin = false
min_windows_build = 22000

[tray]
supports_tray = true
tray_arg = "--tray"
startup_tray_arg = ""

[finish]
hide_desktop_shortcut = false
hide_launch_after_setup = false
desktop_shortcut_default = true
launch_after_setup_default = true
launch_tray_default = false
launch_at_login_default = false
login_tray_default = true

[theme]
background_hex = "#282828"
surface_hex = "#32302F"
elevated_surface_hex = "#3C3836"
border_hex = "#1D2021"
accent_hex = "#FABD2F"
success_hex = "#B8BB26"
warning_hex = "#FE8019"
info_hex = "#83A598"
text_hex = "#EBDBB2"
muted_hex = "#928374"
cursor_hex = "#FE8019"
