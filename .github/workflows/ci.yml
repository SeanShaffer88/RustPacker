name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Fail rather than silently resolving a different dependency graph than the
  # committed lockfile.
  CARGO_NET_LOCKED: "true"

jobs:
  # Dependency health. Separate from the build jobs because it answers a
  # different question — "is what we depend on still safe and correctly
  # licensed?" — and because a RustSec advisory should not be able to fail a
  # build that legitimately has nothing wrong with it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny (advisories, licences, bans, sources)
        run: cargo deny check

      # `cargo audit` reads Cargo.lock and cross-checks the RustSec database;
      # it catches the same advisories as `deny` but reports them in the
      # format GitHub's dependency graph understands.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Fast, platform-independent coverage: the core crate, the CLI, and its
  # end-to-end tests all build and run on Linux. Stub/GUI are
  # Windows-gated, so they are only *checked* here (their `cfg(not(windows))`
  # main() compiles) and built for real in the windows job below.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
      - name: Clippy (Windows-only crates included)
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test (host target on Windows runner)
        run: cargo test --workspace
      - name: Build release (x86_64-pc-windows-msvc, crt-static)
        run: cargo build --release --target x86_64-pc-windows-msvc --workspace
      - name: Show binaries
        run: dir target\x86_64-pc-windows-msvc\release\*.exe
      # The `.res` files `build.rs` writes are only real if CVTRES accepted
      # them and the linker kept them. This parses the PE resource directory
      # of the built binaries and fails if a resource is missing.
      - name: Verify embedded resources
        shell: bash
        run: |
          set -euo pipefail
          # Enumerate with `find`: bash globbing of nested build directories is
          # unreliable under Git for Windows, and this must not silently pass
          # because it matched nothing.
          mapfile -t res_files < <(find target/x86_64-pc-windows-msvc/release/build -name '*.res' -path '*/out/*')
          if [ ${#res_files[@]} -eq 0 ]; then
            echo "::error::build.rs produced no .res file"
            exit 1
          fi
          for f in "${res_files[@]}"; do
            python tools/inspect_resources.py --res "$f"
          done
          # And confirm the linker kept them: parse each binary's resource
          # directory rather than trusting the .res on its own.
          for exe in rustpacker-stub rustpacker-gui; do
            python tools/inspect_resources.py "target/x86_64-pc-windows-msvc/release/$exe.exe"
          done

      - name: Smoke-test the CLI binary
        run: |
          target\x86_64-pc-windows-msvc\release\rustpacker-cli.exe init --out %TEMP%\rustpacker-ci\rustpacker.toml --force
          target\x86_64-pc-windows-msvc\release\rustpacker-cli.exe validate %TEMP%\rustpacker-ci\rustpacker.toml

      # The release assets are built here, on every push, so a broken release
      # is caught before a tag rather than during one.
      - name: Upload the Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          if-no-files-found: error
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/rustpacker-cli.exe
            target/x86_64-pc-windows-msvc/release/rustpacker-gui.exe
            target/x86_64-pc-windows-msvc/release/rustpacker-stub.exe
