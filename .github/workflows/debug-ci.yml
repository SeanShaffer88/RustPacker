name: Debug CI

on:
  push:
    branches: [arena/6b18f778-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Registry symbol location
        shell: bash
        run: |
          set +e
          ROOT=$(rustc --print sysroot)/lib/rustlib/src/rust
          echo "src root: $ROOT"
          # Try to fetch the windows-sys source used by the lockfile.
          cargo fetch -q 2>/dev/null
          WS=$(find ~/.cargo/registry/src -maxdepth 2 -name 'windows-sys-0.61*' | head -n 1)
          echo "windows-sys: $WS"
          {
            echo '<!-- rustpacker-regdiag -->'
            echo '```'
            if [ -n "$WS" ]; then
              echo "--- files mentioning RegCreateKeyExW ---"
              grep -rn "RegCreateKeyExW" "$WS/src" | head -n 20
              echo "--- features list containing Registry ---"
              sed -n '/^\[features\]/,$p' "$WS/Cargo.toml" | grep -n "Registry\|RealFunc" | head -n 20
            else
              echo "windows-sys source not found"
            fi
            echo '```'
          } > diag.md
          cat diag.md

      - name: Post diagnostics as a PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i 's/<!-- rustpacker-regdiag -->/<!-- rustpacker-regdiag -->/' diag.md
          head -c 60000 diag.md > diag-truncated.md
          gh pr comment 1 --body-file diag-truncated.md --edit-last 2>/dev/null || gh pr comment 1 --body-file diag-truncated.md
