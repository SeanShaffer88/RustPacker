name: Debug CI

on:
  push:
    branches: [arena/6b18f778-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: clippy + test with full output
        shell: bash
        run: |
          set +e
          {
            echo '<!-- rustpacker-diag3 -->'
            echo '### clippy'
            echo '```'
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating|Blocking)' | head -n 400
            echo '```'
            echo '### test'
            echo '```'
            cargo test --workspace 2>&1 | tail -n 200
            echo '```'
          } > diag.md
          wc -c diag.md

      - name: Post diagnostics as a PR comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 diag.md > diag-truncated.md
          gh pr comment 1 --body-file diag-truncated.md
