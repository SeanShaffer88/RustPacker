name: Debug CI

# TEMPORARY diagnostic aid while this branch is in review: this sandbox cannot
# download Actions logs, but it can read PR comments, so each failing check
# reports itself there. Delete this file before merging to main.
on:
  push:
    branches: [arena/9c4c73ed-rustpacker]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(cargo fmt --all -- --check 2>&1)
          code=$?
          {
            echo "<!-- diag fmt $code -->"
            echo "### fmt (exit $code)"
            echo '```'
            printf '%s\n' "$out" | head -n 120
            echo '```'
          } > c.md
          gh pr comment 6 --body-file c.md

  clippy-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(cargo clippy --workspace --all-targets -- -D warnings 2>&1)
          code=$?
          {
            echo "<!-- diag clippy-linux $code -->"
            echo "### clippy linux (exit $code)"
            echo '```'
            printf '%s\n' "$out" | grep -vE '^\s+(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Blocking)' | head -n 150
            echo '```'
          } > c.md
          gh pr comment 6 --body-file c.md

  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo clippy --workspace --all-targets -- -D warnings > out.txt 2>&1
          code=$?
          {
            echo "<!-- diag clippy-win $code -->"
            echo "### clippy windows (exit $code)"
            echo '```'
            grep -vE '^\s+(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding)' out.txt | head -n 150
            echo '```'
          } > c.md
          gh pr comment 6 --body-file c.md

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cargo deny check > out.txt 2>&1
          code=$?
          {
            echo "<!-- diag deny $code -->"
            echo "### deny (exit $code)"
            echo '```'
            cat out.txt | head -n 100
            echo '```'
          } > c.md
          gh pr comment 6 --body-file c.md
