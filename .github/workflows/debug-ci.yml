name: Debug CI

on:
  push:
    branches: [arena/8ed6706f-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: All checks with output
        shell: bash
        run: |
          set +e
          {
            echo '<!-- rustpacker-diag -->'
            echo '### fmt'
            echo '```'
            cargo fmt --all -- --check 2>&1 | head -n 120
            echo '```'
            echo '### clippy (windows target)'
            echo '```'
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating|Blocking|Locking|Adding)' | head -n 200
            echo '```'
            echo '### build release (windows target)'
            echo '```'
            cargo build --release --target x86_64-pc-windows-msvc --workspace 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating)' | tail -n 60
            echo '```'
            echo '### embedded resources'
            echo '```'
            ls -l target/x86_64-pc-windows-msvc/release/*.exe 2>&1
            echo '--- the .res cargo handed to the linker ---'
            for f in target/x86_64-pc-windows-msvc/release/build/*/out/*.res; do
              echo "$f: $(stat -c%s "$f") bytes"
              python tools/inspect_resources.py --res "$f" 2>&1
            done
            echo '```'
            echo '### PE resource table'
            echo '```'
            python tools/inspect_resources.py target/x86_64-pc-windows-msvc/release/*.exe 2>&1
            echo '```'
          } > diag.md

      - name: Post diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 diag.md > diag-truncated.md || true
          gh pr comment 3 --body-file diag-truncated.md
