name: Debug CI

on:
  push:
    branches: [arena/6b18f778-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Registry module gating + full build output
        shell: bash
        run: |
          set +e
          cargo fetch -q 2>/dev/null
          WS=$(find ~/.cargo/registry/src -maxdepth 2 -name 'windows-sys-0.61*' | head -n 1)
          {
            echo '<!-- rustpacker-regdiag2 -->'
            echo '### registry module head'
            echo '```'
            sed -n '1,20p' "$WS/src/Windows/Win32/System/Registry/mod.rs"
            echo '```'
            echo '### Registry feature definition (context)'
            echo '```'
            grep -n -B2 -A2 '^Win32_System_Registry' "$WS/Cargo.toml"
            echo '```'
            echo '### clippy'
            echo '```'
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating|Blocking)' | head -n 300
            echo '```'
          } > diag.md
          cat diag.md

      - name: Post diagnostics as a PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 diag.md > diag-truncated.md
          gh pr comment 1 --body-file diag-truncated.md
