name: Debug CI

on:
  push:
    branches: [arena/6b18f778-rustpacker]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6b18f778-rustpacker
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt and commit if needed
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply rustfmt (automated)"
            git push
            echo "pushed formatted commit"
          else
            echo "already formatted"
          fi

      - name: Full CI checks with output
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '<!-- rustpacker-diag4 -->'
            echo '### fmt'
            echo '```'
            cargo fmt --all -- --check 2>&1 | head -n 80
            echo '```'
            echo '### clippy'
            echo '```'
            RUSTFLAGS="-D warnings" cargo clippy --workspace --all-targets -- -D warnings 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating|Blocking)' | head -n 200
            echo '```'
            echo '### test'
            echo '```'
            cargo test --workspace 2>&1 | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating)' | tail -n 120
            echo '```'
          } > diag.md
          wc -c diag.md

      - name: Post diagnostics as a PR comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 diag.md > diag-truncated.md
          gh pr comment 1 --body-file diag-truncated.md
