name: Debug CI

on:
  push:
    branches: [arena/3c5679ce-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: All checks with output
        shell: bash
        run: |
          set +e
          {
            echo '<!-- rustpacker-diag -->'
            echo '### clippy'
            echo '```'
            cargo clippy --workspace --all-targets -- -D warnings 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating|Blocking|Locking|Adding)' | head -n 250
            echo '```'
            echo '### test'
            echo '```'
            cargo test --workspace 2>&1 | grep -vE '^\s+(Compiling|Checking|Finished|Downloading|Downloaded|Updating)' | tail -n 120
            echo '```'
            echo '### fmt'
            echo '```'
            cargo fmt --all -- --check 2>&1 | head -n 120
            echo '```'
          } > diag.md
          wc -c diag.md

      - name: Post diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 60000 diag.md > diag-truncated.md || true
          gh pr comment 2 --body-file diag-truncated.md || echo "no PR open yet"
