name: Debug CI

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Collect diagnostics
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "-D warnings"
          $report = @()
          $report += '## fmt'
          $report += (cargo fmt --all -- --check 2>&1 | Select-Object -First 120)
          $report += '## clippy windows'
          $report += (cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | Select-Object -First 200)
          $report += '## check windows'
          $report += (cargo check --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | Select-Object -First 200)
          $report -join "`n" | Out-File -Encoding utf8 report.txt
      - name: Post report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $body = Get-Content report.txt -Raw
          if ($body.Length -gt 60000) { $body = $body.Substring(0, 60000) }
          $body | Out-File -Encoding utf8 body.txt
          gh pr comment 16 --body-file body.txt
