name: Debug CI

# TEMPORARY diagnostic aid while this branch is in review: this sandbox cannot
# download Actions logs, but it can read PR comments, so each failing check
# reports itself there. Delete this file before merging to main.
on:
  push:
    branches: [arena/21dc463e-rustpacker]

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(cargo fmt --all -- --check 2>&1)
          code=$?
          {
            echo "<!-- diag fmt $code -->"
            echo "### fmt (exit $code)"
            echo '```'
            printf '%s\n' "$out" | head -n 120
            echo '```'
          } > c.md
          gh pr comment 12 --body-file c.md
