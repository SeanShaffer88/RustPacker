name: Debug CI

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Collect diagnostics
        shell: bash
        run: |
          export RUSTFLAGS="-D warnings"
          {
            echo '## fmt'
            cargo fmt --all -- --check 2>&1 | head -150
            echo '## clippy errors'
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 | grep -E 'error|warning:' -A 8 | head -300
            echo '## clippy done'
          } > report.txt 2>&1
          true
      - name: Post report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 report.txt > body.txt 2>/dev/null || echo '(no report)' > body.txt
          gh pr comment 16 --body-file body.txt
