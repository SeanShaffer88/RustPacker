name: Debug CI

# TEMPORARY diagnostic aid while this branch is in review: this sandbox cannot
# download Actions logs, but it can read PR comments, so each failing check
# reports itself there. Delete this file before merging to main.
on:
  push:
    branches: [arena/74b138fd-rustpacker]

permissions:
  contents: read
  pull-requests: write

jobs:
  clippy-diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(cargo clippy --workspace --all-targets -- -D warnings 2>&1)
          code=$?
          {
            echo "<!-- diag clippy $code -->"
            echo "### clippy (exit $code)"
            echo '```'
            printf '%s\n' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' | grep -E '^(error|warning)' -A 8 | head -n 200
            echo '```'
          } > c.md
          gh pr comment 14 --body-file c.md

  msrv-diag:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.78.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.78.0"
      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(cargo check --workspace --all-targets 2>&1)
          code=$?
          {
            echo "<!-- diag msrv $code -->"
            echo "### msrv check (exit $code)"
            echo '```'
            printf '%s\n' "$out" | sed -e 's/\x1b\[[0-9;]*m//g' | tail -n 80
            echo '```'
          } > c.md
          gh pr comment 14 --body-file c.md
