name: Debug CI

on:
  push:
    branches: [arena/6b18f778-rustpacker]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Collect diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '<!-- rustpacker-diag -->'
            echo '### fmt'
            echo '```'
            cargo fmt --all -- --check 2>&1 | head -n 400
            echo '```'
            echo '### clippy'
            echo '```'
            cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc 2>&1 \
              | grep -vE '^\s+(Compiling|Checking|Finished|Blocking)' | head -n 500
            echo '```'
            echo '### test'
            echo '```'
            cargo test --workspace 2>&1 | tail -n 300
            echo '```'
          } > diag.md
          wc -c diag.md

      - name: Post diagnostics as a PR comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the comment under GitHub's 65536-character limit.
          head -c 60000 diag.md > diag-truncated.md
          gh pr comment 1 --body-file diag-truncated.md
